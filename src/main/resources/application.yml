spring:
  application:
    name: lifeos-strategy-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/strategy}
    username: ${DB_USERNAME:strategy}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A new consumer group (first deployment) starts from the oldest event, so no recommendation is missed.
      auto-offset-reset: earliest
  security:
    oauth2:
      client:
        # Strategy's own service account, for Keycloak's admin API (deleting a user's identity account).
        # Keycloak: client "lifeos-strategy", service account with realm-management/manage-users only.
        registration:
          keycloak-admin:
            provider: keycloak
            client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:lifeos-strategy}
            client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:lifeos}/protocol/openid-connect/token
      resourceserver:
        jwt:
          # Inner security layer: the service validates the JWT itself (lifeos-base-web).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lifeos}
          # Keycloak must add this audience to access tokens (audience mapper on the lifeos realm).
          audiences: ${JWT_AUDIENCES:lifeos-api}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

lifeos:
  messaging:
    outbox:
      topic: lifeos.strategy.events.v1
    inbox:
      consumer: strategy
  strategy:
    identity:
      admin-base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:lifeos}
      client-registration-id: keycloak-admin
